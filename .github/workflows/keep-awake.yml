# Render's free plan puts the API to sleep after ~15 idle minutes, and the first
# request after that takes ~30 s to wake it — too slow for an SOS, and medicine
# reminders can't be sent while it sleeps. This pings it every 10 minutes.
# GitHub often runs scheduled jobs late, so the server also pings itself
# (server/utils/keepAwake.js). This job is the backup that wakes it after a restart.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://lifelink-api-w738.onrender.com/)
            echo "attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
